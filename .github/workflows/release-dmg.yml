name: Build Apple silicon DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build Apple silicon executable
        run: swift build -c release --arch arm64

      - name: Package application and DMG
        run: |
          set -euo pipefail
          APP="MacSentinel.app"
          CONTENTS="$APP/Contents"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          BIN_PATH="$(swift build -c release --show-bin-path --arch arm64)"
          mkdir -p "$CONTENTS/MacOS"
          cp "$BIN_PATH/MacSentinel" "$CONTENTS/MacOS/MacSentinel"
          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MacSentinel</string>
              <key>CFBundleIdentifier</key>
              <string>local.macsentinel</string>
              <key>CFBundleName</key>
              <string>MacSentinel</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          mkdir -p dist
          mkdir -p dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "MacSentinel" -srcfolder dmg-root -ov -format UDZO "dist/MacSentinel-arm64.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacSentinel-arm64-dmg
          path: dist/MacSentinel-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MacSentinel-arm64.dmg --title "MacSentinel $GITHUB_REF_NAME" --generate-notes
