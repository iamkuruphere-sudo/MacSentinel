name: Build Apple silicon DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Configure code signing
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Configuring Apple Developer ID signing identity..."
            KEYCHAIN_PATH="$RUNNER_TEMP/macsentinel-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            rm -f "$CERTIFICATE_PATH"

            SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
            if [ -n "$SIGNING_IDENTITY" ]; then
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
              echo "has_developer_id=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "has_developer_id=false" >> "$GITHUB_OUTPUT"
          echo "No Apple Developer ID certificate configured. Falling back to ad-hoc signing for open-source distribution."

      - name: Build Apple silicon executable
        run: swift build -c release --arch arm64

      - name: Package application bundle
        run: |
          set -euo pipefail
          APP="MacSentinel.app"
          CONTENTS="$APP/Contents"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          BIN_PATH="$(swift build -c release --show-bin-path --arch arm64)"
          mkdir -p "$CONTENTS/MacOS"
          cp "$BIN_PATH/MacSentinel" "$CONTENTS/MacOS/MacSentinel"
          mkdir -p "$CONTENTS/Resources"
          cp Resources/MacSentinel.icns "$CONTENTS/Resources/MacSentinel.icns"
          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MacSentinel</string>
              <key>CFBundleIconFile</key>
              <string>MacSentinel</string>
              <key>CFBundleIdentifier</key>
              <string>local.macsentinel</string>
              <key>CFBundleName</key>
              <string>MacSentinel</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$CONTENTS/Info.plist"

          if [ "${{ steps.signing.outputs.has_developer_id }}" = "true" ]; then
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          else
            codesign --force --deep --sign - --timestamp=none "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

      - name: Notarize and staple application
        if: steps.signing.outputs.has_developer_id == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent MacSentinel.app "$RUNNER_TEMP/MacSentinel-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MacSentinel-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple MacSentinel.app
          xcrun stapler validate MacSentinel.app
          codesign --verify --deep --strict --verbose=2 MacSentinel.app

      - name: Create disk image
        run: |
          set -euo pipefail
          mkdir -p dist
          mkdir -p dmg-root
          cp -R "MacSentinel.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "MacSentinel" -srcfolder dmg-root -ov -format UDZO "dist/MacSentinel-arm64.dmg"
          hdiutil verify "dist/MacSentinel-arm64.dmg"
          if [ "${{ steps.signing.outputs.has_developer_id }}" != "true" ]; then
            codesign --force --sign - "dist/MacSentinel-arm64.dmg"
          fi

      - name: Notarize and staple disk image
        if: steps.signing.outputs.has_developer_id == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/MacSentinel-arm64.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/MacSentinel-arm64.dmg"
          xcrun stapler validate "dist/MacSentinel-arm64.dmg"

      - name: Verify disk image contents
        run: |
          set -euo pipefail
          APP="MacSentinel.app"
          MOUNTPOINT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNTPOINT" -quiet || true; rmdir "$MOUNTPOINT"' EXIT
          hdiutil attach "dist/MacSentinel-arm64.dmg" -readonly -nobrowse -mountpoint "$MOUNTPOINT"
          codesign --verify --deep --strict --verbose=2 "$MOUNTPOINT/$APP"
          if [ "${{ steps.signing.outputs.has_developer_id }}" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$MOUNTPOINT/$APP"
          fi
          test -s "$MOUNTPOINT/$APP/Contents/Resources/MacSentinel.icns"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacSentinel-arm64-dmg
          path: dist/MacSentinel-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.has_developer_id }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" dist/MacSentinel-arm64.dmg --title "MacSentinel $GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/MacSentinel-arm64.dmg \
              --title "MacSentinel $GITHUB_REF_NAME" \
              --notes $'### MacSentinel '"$GITHUB_REF_NAME"$' (macOS Apple silicon)\n\nThis DMG and its app bundle are ad-hoc signed to detect changes to the downloaded files. They are **not** signed with an Apple Developer ID certificate and are **not notarized**, so macOS Gatekeeper may warn that Apple cannot verify the app. An ad-hoc signature does not establish developer identity or remove this warning.\n\nTo try the app, drag **MacSentinel.app** to Applications, then Control-click it in Finder and choose **Open**. If macOS still blocks it, use **System Settings → Privacy & Security → Open Anyway** only if you trust this download. Do not remove the app'\''s quarantine attributes.'
          fi
